<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EAF4FF"/>
      <stop offset="55%" stop-color="#F2ECFF"/>
      <stop offset="100%" stop-color="#FFEFF5"/>
    </linearGradient>
    <radialGradient id="sphere" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#DCEBFC"/>
      <stop offset="100%" stop-color="#C9DDF6"/>
    </radialGradient>
    <linearGradient id="vec" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#C8A2E8"/>
      <stop offset="100%" stop-color="#F49AC1"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#D3E3F6" stroke-width="1"/>
    </pattern>
    <style>
      .mono{font-family:'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace}
      .sans{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
      .tw{animation:tw 3s ease-in-out infinite}
      .tw2{animation:tw 3s ease-in-out 1s infinite}
      .tw3{animation:tw 3s ease-in-out 2s infinite}
      @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
      .blink{animation:bl 1.1s steps(1) infinite}
      @keyframes bl{50%{opacity:0}}
    </style>
  </defs>

  <rect width="1200" height="320" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="22" fill="url(#grid)" opacity=".55"/>
  <rect x="1" y="1" width="1198" height="318" rx="21" fill="none" stroke="#CFE2F8" stroke-width="2"/>

  <!-- barra de janela -->
  <circle cx="34" cy="30" r="6" fill="#F7B8CF"/>
  <circle cx="54" cy="30" r="6" fill="#E3D0F7"/>
  <circle cx="74" cy="30" r="6" fill="#B9DAFB"/>
  <text x="100" y="35" class="mono" font-size="14" fill="#9AA8C7">~/yasmin.lab — plataforma de pesquisa</text>

  <!-- textos -->
  <text x="64" y="104" class="mono" font-size="16" fill="#A58BD6">◆ boot sequence ok · status: online<tspan class="blink" fill="#F49AC1"> ▌</tspan></text>
  <text x="62" y="170" class="sans" font-size="62" font-weight="700" fill="#5B7DB1" letter-spacing="1">Yasmin Lourdes</text>
  <text x="64" y="208" class="sans" font-size="21" fill="#7C8DB0">Ciência da Computação · pesquisadora · física &amp; quântica</text>

  <!-- pills -->
  <g class="mono" font-size="14">
    <rect x="64" y="234" width="170" height="34" rx="17" fill="#FFFFFF" stroke="#B9DAFB" stroke-width="1.5"/>
    <text x="149" y="256" text-anchor="middle" fill="#5B7DB1">|ψ⟩ quântica</text>
    <rect x="246" y="234" width="170" height="34" rx="17" fill="#FFFFFF" stroke="#D9C4F2" stroke-width="1.5"/>
    <text x="331" y="256" text-anchor="middle" fill="#8E6CC9">k_eff nuclear</text>
    <rect x="428" y="234" width="170" height="34" rx="17" fill="#FFFFFF" stroke="#F7C3D7" stroke-width="1.5"/>
    <text x="513" y="256" text-anchor="middle" fill="#D2709A">♡ IA em saúde</text>
  </g>

  <!-- estrelinhas -->
  <g fill="#F49AC1">
    <circle class="tw" cx="700" cy="70" r="3"/>
    <circle class="tw2" cx="1130" cy="285" r="2.5"/>
    <circle class="tw3" cx="760" cy="270" r="2.5"/>
  </g>
  <g fill="#8EBBEB">
    <circle class="tw2" cx="660" cy="190" r="2.5"/>
    <circle class="tw3" cx="1160" cy="60" r="3"/>
    <circle class="tw" cx="1010" cy="40" r="2"/>
  </g>

  <!-- esfera de Bloch -->
  <g transform="translate(880 165)">
    <circle r="100" fill="url(#sphere)" stroke="#A9CCF0" stroke-width="2"/>
    <ellipse rx="100" ry="28" fill="none" stroke="#A9CCF0" stroke-width="1.5" stroke-dasharray="5 5"/>
    <ellipse rx="28" ry="100" fill="none" stroke="#D4E4F7" stroke-width="1.2"/>
    <line x1="0" y1="-118" x2="0" y2="118" stroke="#9DB8DB" stroke-width="1.5"/>
    <line x1="-118" y1="0" x2="118" y2="0" stroke="#C7D8EE" stroke-width="1.2"/>
    <text x="0" y="-126" text-anchor="middle" class="mono" font-size="16" fill="#5B7DB1">|0⟩</text>
    <text x="0" y="142" text-anchor="middle" class="mono" font-size="16" fill="#5B7DB1">|1⟩</text>
    <!-- vetor de estado precessionando -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-28;28;-28" dur="6s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="48" y2="-74" stroke="url(#vec)" stroke-width="4" stroke-linecap="round"/>
      <circle cx="48" cy="-74" r="8" fill="#F49AC1" stroke="#FFFFFF" stroke-width="2"/>
    </g>
    <circle r="5" fill="#5B7DB1"/>
  </g>

  <!-- átomo -->
  <g transform="translate(1085 100)" fill="none" stroke-width="1.6">
    <ellipse rx="52" ry="18" stroke="#B9DAFB"/>
    <ellipse rx="52" ry="18" stroke="#D9C4F2" transform="rotate(60)"/>
    <ellipse rx="52" ry="18" stroke="#F7C3D7" transform="rotate(-60)"/>
    <circle r="7" fill="#C8A2E8" stroke="none"/>
    <circle r="4" fill="#5B7DB1" stroke="none">
      <animateMotion dur="3s" repeatCount="indefinite" path="M52,0 A52,18 0 1,1 -52,0 A52,18 0 1,1 52,0"/>
    </circle>
  </g>

  <!-- núcleo de reator: elementos combustíveis hexagonais -->
  <g transform="translate(1085 232)" stroke="#FFFFFF" stroke-width="2">
    <polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8" fill="#F7C3D7"/>
    <polygon points="28,-16 42,-8 42,8 28,16 14,8 14,-8" fill="#B9DAFB"/>
    <polygon points="-28,-16 -14,-8 -14,8 -28,16 -42,8 -42,-8" fill="#D9C4F2"/>
    <polygon points="14,-40 28,-32 28,-16 14,-8 0,-16 0,-32" fill="#D9C4F2"/>
    <polygon points="-14,-40 0,-32 0,-16 -14,-8 -28,-16 -28,-32" fill="#B9DAFB"/>
    <polygon points="14,8 28,16 28,32 14,40 0,32 0,16" fill="#B9DAFB"/>
    <polygon points="-14,8 0,16 0,32 -14,40 -28,32 -28,16" fill="#F7C3D7">
      <animate attributeName="fill" values="#F7C3D7;#F49AC1;#F7C3D7" dur="2.4s" repeatCount="indefinite"/>
    </polygon>
  </g>
</svg>
